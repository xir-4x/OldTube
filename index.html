<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OldTube - Küresel Video Platformu</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            --header-bg: rgba(255, 255, 255, 0.55);
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-hover: rgba(255, 255, 255, 0.95);
            --text-color: #0b2545;
            --subtext-color: #3a5a40;
            --glass-border: rgba(255, 255, 255, 0.75);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --button-bg: linear-gradient(180deg, #56ab2f 0%, #a8e063 100%);
            --button-text: #ffffff;
            --input-bg: rgba(255, 255, 255, 0.85);
            
            --profile-primary-color: #ff0055;
            --profile-page-bg: #0b2545;
            --profile-card-darker-bg: #051324;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --header-bg: rgba(16, 28, 40, 0.75);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(255, 255, 255, 0.18);
            --text-color: #e0f2fe;
            --subtext-color: #7dd3fc;
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --button-bg: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
            --button-text: #ffffff;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        body.profile-active-page {
            background: var(--profile-page-bg) !important;
        }

        .glass {
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .owner-badge {
            color: #ff0033 !important;
            font-weight: 900 !important;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 0, 51, 0.4);
            margin-left: 6px;
            display: inline-block;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; margin: 10px; border-radius: 20px;
            position: sticky; top: 10px; z-index: 100; gap: 10px; flex-wrap: wrap;
        }

        .logo {
            font-size: 24px; font-weight: 900;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        /* 🔎 KANAL ARAMA ÇUBUĞU */
        .search-box {
            position: relative;
            display: flex; align-items: center; gap: 5px; flex: 1; max-width: 380px;
            margin: 0 10px; background: var(--input-bg);
            border: 1px solid var(--glass-border); border-radius: 14px;
            padding: 3px 6px 3px 12px;
        }

        .search-icon { opacity: 0.6; font-size: 14px; }

        .search-box input {
            flex: 1; border: none; background: transparent;
            color: var(--text-color); outline: none; font-size: 13px;
            padding: 6px 0;
        }

        .search-results-dropdown {
            position: absolute; top: 110%; left: 0; width: 100%;
            background: var(--header-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 14px;
            max-height: 250px; overflow-y: auto; display: none;
            flex-direction: column; gap: 4px; padding: 6px; z-index: 150;
            box-shadow: var(--glass-shadow);
        }

        .search-result-item {
            padding: 8px 12px; border-radius: 10px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 13px;
        }
        .search-result-item:hover { background: var(--card-hover); }

        .nav-buttons { display: flex; gap: 8px; }
        
        .btn {
            padding: 8px 14px; border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: var(--card-bg); color: var(--text-color);
            cursor: pointer; font-weight: bold; font-size: 13px;
            display: inline-flex; align-items: center; gap: 6px;
        }

        .btn.nav-active {
            background: #ff0055 !important;
            color: #ffffff !important;
            border-color: #ff0055 !important;
            box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3);
        }

        .btn-primary { background: var(--button-bg); color: var(--button-text); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .sub-btn {
            padding: 6px 14px; border-radius: 10px; font-size: 12px;
            font-weight: bold; cursor: pointer; border: none; margin-left: 8px;
            transition: transform 0.2s, background 0.2s;
        }
        .sub-btn:active { transform: scale(0.95); }
        .sub-btn.subscribed { background: #4a5568; color: #fff; }
        .sub-btn.not-subscribed { background: #ff0055; color: #fff; box-shadow: 0 2px 8px rgba(255,0,85,0.4); }

        .user-section { display: flex; align-items: center; gap: 8px; }
        .header-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            object-fit: cover; border: 2px solid var(--glass-border); cursor: pointer;
        }

        main { display: flex; padding: 0 10px 20px 10px; gap: 15px; flex: 1; }

        #normalView { display: flex; width: 100%; gap: 15px; }
        #subscriptionsView { display: none; width: 100%; flex-direction: column; gap: 10px; }
        
        .player-section { flex: 3; display: flex; flex-direction: column; gap: 12px; }

        .video-container {
            position: relative; padding-bottom: 56.25%; height: 0;
            border-radius: 20px; overflow: hidden;
            border: 2px solid var(--glass-border); background: #000;
        }

        .video-container video {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; border: none; outline: none;
        }

        .placeholder-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); color: #fff; text-align: center; width: 90%;
        }

        .actions-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--glass-border);
            flex-wrap: wrap; gap: 8px;
        }

        .comments-section {
            margin-top: 10px; padding: 15px; border-radius: 18px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .comment-input-box { display: flex; gap: 8px; }
        .comment-input-box input {
            flex: 1; padding: 10px; border-radius: 12px;
            border: 1px solid var(--glass-border); background: var(--input-bg);
            color: var(--text-color); outline: none; font-size: 13px;
        }

        .comment-list { display: flex; flex-direction: column; gap: 10px; }
        .comment-item { display: flex; gap: 10px; align-items: flex-start; }
        .comment-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .comment-content { background: var(--card-bg); padding: 8px 12px; border-radius: 12px; border: 1px solid var(--glass-border); width: 100%; }

        .sidebar {
            flex: 1.2; display: flex; flex-direction: column;
            gap: 10px; max-height: calc(100vh - 100px); overflow-y: auto;
        }

        /* RESİMLİ VİDEO KARTI */
        .video-card {
            display: flex; gap: 10px; cursor: pointer;
            background: var(--card-bg); padding: 8px; border-radius: 14px;
            border: 1px solid var(--glass-border);
        }
        .video-card:hover { background: var(--card-hover); }
        .video-card img { width: 110px; height: 65px; object-fit: cover; border-radius: 10px; background: #333; }
        .video-card-info { flex: 1; }
        .video-card-info h4 {
            font-size: 12px; color: var(--text-color);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* KANAL KARTI */
        .channel-card {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 14px 18px; border-radius: 16px;
            border: 1px solid var(--glass-border); cursor: pointer;
        }
        .channel-card:hover { background: var(--card-hover); }

        /* PROFİL SAYFASI YAPISI */
        #profileView { display: none; width: 100%; flex-direction: column; gap: 20px; }
        .profile-header {
            padding: 30px; border-radius: 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
            background: var(--profile-card-darker-bg) !important;
            border: 3px solid var(--profile-primary-color) !important;
            box-shadow: 0 0 25px var(--profile-primary-color) !important;
            position: relative;
        }
        .profile-avatar-large { 
            width: 95px; height: 95px; border-radius: 50%; 
            object-fit: cover; border: 3px solid var(--profile-primary-color) !important; 
        }
        
        .profile-name-text {
            color: var(--profile-primary-color) !important;
            font-size: 26px; font-weight: 900;
        }

        .profile-videos-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
        }

        .music-player-box {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 12px; margin-top: 10px;
        }

        .clickable-user {
            cursor: pointer; text-decoration: underline;
        }
        .clickable-user:hover { color: #ff0055; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 200;
            justify-content: center; align-items: center; padding: 10px;
        }
        .modal-content {
            padding: 20px; border-radius: 20px; width: 100%; max-width: 400px;
            display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto;
        }
        .modal-content input, .modal-content select, .modal-content textarea {
            padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: var(--input-bg); color: var(--text-color); outline: none; font-size: 13px;
        }

        .color-picker-group {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--input-bg); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--glass-border);
        }

        @media (max-width: 900px) {
            #normalView { flex-direction: column; }
            header { justify-content: space-between; padding: 10px 15px; }
            .search-box { order: 3; max-width: 100%; width: 100%; margin: 5px 0; }
            .sidebar { max-height: none; }
        }
    </style>
</head>
<body data-theme="light">

    <header class="glass">
        <div class="logo" onclick="switchTab('normal')">📺 OldTube</div>

        <!-- 🔎 KANAL ARAMA ÇUBUĞU VE DROPDOWN -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Kanal / Kullanıcı ara..." oninput="handleChannelSearch()" onfocus="handleChannelSearch()">
            <div class="search-results-dropdown" id="searchResultsDropdown"></div>
        </div>

        <div class="nav-buttons">
            <button class="btn nav-active" id="btnNormal" onclick="switchTab('normal')">Videolar</button>
            <button class="btn" id="btnSubs" onclick="switchTab('subscriptions')">🔔 Abonelikler</button>
            <button class="btn" id="btnProfile" onclick="switchTab('profile', currentUser ? currentUser.username : null)" style="display:none;">👤 Profilim</button>
        </div>

        <div class="user-section">
            <button class="btn btn-primary" id="uploadBtn" onclick="openModal('uploadModal')" style="display:none;">+ Yükle</button>
            <div id="authButtons" style="display:flex; gap:5px;">
                <button class="btn" onclick="openModal('loginModal')">Giriş</button>
                <button class="btn btn-primary" onclick="openModal('registerModal')">Kaydol</button>
            </div>
            <div id="userInfo" style="display:none; align-items:center; gap:8px;">
                <img id="headerAvatarImg" class="header-avatar" src="" onclick="switchTab('profile', currentUser.username)">
                <span id="usernameDisplay" class="clickable-user" style="font-weight: bold; font-size: 13px;" onclick="switchTab('profile', currentUser.username)"></span>
                <button class="btn" onclick="logout()">Çıkış</button>
            </div>
            <button class="btn" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <main>
        <!-- VİDEOLAR AKIŞI -->
        <div id="normalView">
            <section class="player-section">
                <div class="video-container" id="playerHolder">
                    <div id="placeholder" class="placeholder-text">Videolar Yükleniyor...</div>
                </div>
                <div class="video-details glass">
                    <h2 id="videoTitle" style="font-size: 18px;">Bir video seçin</h2>
                    <div style="display:flex; align-items:center; gap:8px; margin: 6px 0;">
                        <p id="videoAuthor" style="font-weight: bold; font-size: 13px;"></p>
                        <div id="subButtonContainer"></div>
                    </div>
                    <p id="videoDescription" style="font-size: 13px;"></p>

                    <div class="actions-bar" id="normalActionsBar" style="display:none;">
                        <div>
                            <button class="btn" id="likeBtn" onclick="toggleLikeCurrentVideo('like')">👍 <span id="likeCount">0</span></button>
                            <button class="btn" id="dislikeBtn" onclick="toggleLikeCurrentVideo('dislike')">👎 <span id="dislikeCount">0</span></button>
                            <button class="btn" onclick="shareCurrentVideo()">🔗 Paylaş</button>
                        </div>
                    </div>

                    <div class="comments-section" id="normalCommentsSection" style="display:none;">
                        <h4 style="font-size: 14px;">Yorumlar (<span id="commentsCount">0</span>)</h4>
                        <div class="comment-input-box">
                            <input type="text" id="commentInput" placeholder="Yorum yaz...">
                            <button class="btn btn-primary" onclick="submitComment()">Gönder</button>
                        </div>
                        <div class="comment-list" id="commentsListContainer"></div>
                    </div>
                </div>
            </section>

            <aside class="sidebar" id="videoList"></aside>
        </div>

        <!-- ABONE OLUNAN KANALLAR -->
        <div id="subscriptionsView">
            <h3 style="margin-bottom:10px; font-size:16px;">Abone Olduğun Kanallar</h3>
            <div id="subsChannelsList" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <!-- DİNAMİK PROFİL SAYFASI -->
        <div id="profileView">
            <div class="profile-header">
                <img id="profileAvatarDisplay" class="profile-avatar-large" src="" alt="Profil">
                <div style="flex:1;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <h2 id="profileNameDisplay" class="profile-name-text">Kullanıcı Adı</h2>
                        <div id="profilePageSubBtn"></div>
                    </div>
                    <p id="profileBioDisplay" style="font-size: 13px; color:#eee; margin-top:4px;">Biyografi yok.</p>
                    
                    <div class="music-player-box" id="profileMusicContainer" style="display:none;">
                        <span style="font-size:12px; font-weight:bold; color:#fff;">🎵 Arka Plan Müziği:</span>
                        <audio id="profileAudioPlayer" controls style="height:30px;"></audio>
                    </div>

                    <button class="btn btn-primary" id="editProfileBtn" style="margin-top: 12px; display:none;" onclick="openModal('editProfileModal')">⚙️ Profili Düzenle & Kişiselleştir</button>
                </div>
            </div>

            <h3 style="font-size: 16px; margin-top: 10px;">Kanalın Videoları</h3>
            <div class="profile-videos-grid" id="profileVideosGrid"></div>
        </div>
    </main>

    <div class="modal" id="loginModal">
        <div class="modal-content glass">
            <h3>Giriş Yap</h3>
            <input type="text" id="loginUsername" placeholder="Kullanıcı Adı">
            <input type="password" id="loginPassword" placeholder="Şifre">
            <button class="btn btn-primary" onclick="login()">Giriş Yap</button>
            <button class="btn" onclick="closeModal('loginModal')">İptal</button>
        </div>
    </div>

    <div class="modal" id="registerModal">
        <div class="modal-content glass">
            <h3>Kayıt Ol</h3>
            <input type="text" id="regUsername" placeholder="Kullanıcı Adı">
            <input type="password" id="regPassword" placeholder="Şifre (Min 8 Karakter)">
            <button class="btn btn-primary" id="registerBtn" onclick="register()">Kayıt Ol</button>
            <button class="btn" onclick="closeModal('registerModal')">İptal</button>
        </div>
    </div>

    <div class="modal" id="uploadModal">
        <div class="modal-content glass">
            <h3>Video Yükle</h3>
            <input type="text" id="vTitle" placeholder="Video Başlığı">
            <input type="file" id="vFileInput" accept="video/mp4,video/webm">
            <input type="file" id="vThumbInput" accept="image/*">
            <textarea id="vDesc" placeholder="Açıklama"></textarea>
            <button class="btn btn-primary" id="uploadSubmitBtn" onclick="addVideo()">Yükle ve Paylaş</button>
            <button class="btn" onclick="closeModal('uploadModal')">İptal</button>
        </div>
    </div>

    <div class="modal" id="editProfileModal">
        <div class="modal-content glass">
            <h3>Profili Düzenle & Kişiselleştir</h3>
            <label style="font-size:12px; font-weight:bold;">Profil Resmi:</label>
            <input type="file" id="pAvatarInput" accept="image/*">

            <label style="font-size:12px; font-weight:bold;">Arka Plan MP3 Müziği:</label>
            <input type="file" id="pMusicInput" accept="audio/mp3,audio/wav">

            <div class="color-picker-group">
                <label style="font-size:12px; font-weight:bold;">1. Renk (İsim & Dış Çizgi/Parlama):</label>
                <input type="color" id="pPrimaryColorInput" value="#ff0055" style="width:40px; height:30px; border:none; cursor:pointer;">
            </div>

            <div class="color-picker-group">
                <label style="font-size:12px; font-weight:bold;">2. Renk (Sayfa Arka Planı):</label>
                <input type="color" id="pBgColorInput" value="#0b2545" style="width:40px; height:30px; border:none; cursor:pointer;">
            </div>

            <textarea id="pBioInput" placeholder="Biyografi / Hakkında"></textarea>
            <button class="btn btn-primary" id="saveProfileBtn" onclick="saveProfile()">Değişiklikleri Kaydet</button>
            <button class="btn" onclick="closeModal('editProfileModal')">İptal</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ptsbvovfwawrivpqolzi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0c2J2b3Zmd2F3cml2cHFvbHppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1OTkzMDIsImV4cCI6MjEwMTE3NTMwMn0.2c0Q4qNjrMwWtzN1ugDm5wj5GfSoPPT35KQozgFtogU";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let loadedVideos = [];
        let loadedUsers = [];
        let currentUser = JSON.parse(localStorage.getItem('oldtube_user')) || null;
        let currentPlayingVideo = null;
        let viewedProfileUser = null;
        const DEFAULT_AVATAR = "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";

        document.addEventListener('DOMContentLoaded', () => {
            updateUserUI();
            fetchCloudData();

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-box')) {
                    document.getElementById('searchResultsDropdown').style.display = 'none';
                }
            });
        });

        function checkOwnerBadge(username) {
            return (username && username.toLowerCase() === "xir-4x") ? `<span class="owner-badge">[OWNER]</span>` : '';
        }

        function cleanFileName(str) {
            return str.replace(/[^a-zA-Z0-9.\-_]/g, '_');
        }

        function adjustColorBrightness(hex, percent) {
            let num = parseInt(hex.replace("#",""), 16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            B = (num >> 8 & 0x00FF) + amt,
            G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }

        async function fetchCloudData() {
            const { data: vData } = await supabaseClient.from('videos').select('*').order('id', { ascending: false });
            loadedVideos = vData || [];
            
            const { data: uData } = await supabaseClient.from('users').select('*');
            loadedUsers = uData || [];

            renderVideos(loadedVideos);
        }

        // 🔎 KANAL ARAMA SİSTEMİ (Sadece Kullanıcılar)
        function handleChannelSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const dropdown = document.getElementById('searchResultsDropdown');

            if (!query) {
                dropdown.style.display = 'none';
                return;
            }

            const matchingUsers = loadedUsers.filter(u => u.username.toLowerCase().includes(query));

            if (matchingUsers.length === 0) {
                dropdown.innerHTML = '<div style="padding:8px; font-size:12px; opacity:0.7;">Kanal bulunamadı.</div>';
            } else {
                dropdown.innerHTML = matchingUsers.map(u => `
                    <div class="search-result-item" onclick="viewUserProfile('${u.username}')">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <img src="${u.avatar || DEFAULT_AVATAR}" style="width:24px; height:24px; border-radius:50%; object-fit:cover;">
                            <span>${u.username} ${checkOwnerBadge(u.username)}</span>
                        </div>
                        <span style="font-size:11px; opacity:0.6;">Kanalı Gör ➔</span>
                    </div>
                `).join('');
            }

            dropdown.style.display = 'flex';
        }

        function viewUserProfile(username) {
            document.getElementById('searchResultsDropdown').style.display = 'none';
            document.getElementById('searchInput').value = '';
            switchTab('profile', username);
        }

        async function toggleSubscribe(channelAuthor) {
            if (!currentUser) return alert("Abone olmak için giriş yapmalısınız!");
            if (currentUser.username.toLowerCase() === channelAuthor.toLowerCase()) {
                return alert("Kendi kanalınıza abone olamazsınız!");
            }

            let subs = currentUser.subscriptions || [];
            const isSubbed = subs.includes(channelAuthor);

            if (isSubbed) {
                subs = subs.filter(u => u !== channelAuthor);
            } else {
                subs.push(channelAuthor);
            }

            currentUser.subscriptions = subs;
            localStorage.setItem('oldtube_user', JSON.stringify(currentUser));

            renderSubButton(channelAuthor);
            renderProfileSubButton(channelAuthor);

            await supabaseClient.from('users').update({ subscriptions: subs }).eq('id', currentUser.id);

            if (document.getElementById('subscriptionsView').style.display === 'flex') {
                renderSubscriptionsTab();
            }
        }

        function renderSubButton(channelAuthor) {
            const container = document.getElementById('subButtonContainer');
            if (!container) return;

            if (!currentUser || currentUser.username.toLowerCase() === channelAuthor.toLowerCase()) {
                container.innerHTML = '';
                return;
            }

            const isSubbed = (currentUser.subscriptions || []).includes(channelAuthor);
            container.innerHTML = `
                <button class="sub-btn ${isSubbed ? 'subscribed' : 'not-subscribed'}" onclick="toggleSubscribe('${channelAuthor}')">
                    ${isSubbed ? '✓ Abonesin' : '🔔 Abone Ol'}
                </button>
            `;
        }

        function renderProfileSubButton(channelAuthor) {
            const container = document.getElementById('profilePageSubBtn');
            if (!container) return;

            if (!currentUser || currentUser.username.toLowerCase() === channelAuthor.toLowerCase()) {
                container.innerHTML = '';
                return;
            }

            const isSubbed = (currentUser.subscriptions || []).includes(channelAuthor);
            container.innerHTML = `
                <button class="sub-btn ${isSubbed ? 'subscribed' : 'not-subscribed'}" onclick="toggleSubscribe('${channelAuthor}')">
                    ${isSubbed ? '✓ Abonesin' : '🔔 Abone Ol'}
                </button>
            `;
        }

        async function saveProfile() {
            if (!currentUser) return alert("Giriş yapmalısınız!");

            const btn = document.getElementById('saveProfileBtn');
            btn.disabled = true; btn.innerText = "Kaydediliyor...";

            try {
                const avatarInput = document.getElementById('pAvatarInput');
                const musicInput = document.getElementById('pMusicInput');
                const bio = document.getElementById('pBioInput').value.trim();
                const primaryColor = document.getElementById('pPrimaryColorInput').value;
                const bgColor = document.getElementById('pBgColorInput').value;

                let avatarUrl = currentUser.avatar || DEFAULT_AVATAR;
                let musicUrl = currentUser.bg_music || null;

                if (avatarInput.files.length > 0) {
                    const file = avatarInput.files[0];
                    const fileName = `avatar_${currentUser.id}_${Date.now()}_${cleanFileName(file.name)}`;
                    await supabaseClient.storage.from('videos').upload(fileName, file);
                    avatarUrl = `${SUPABASE_URL}/storage/v1/object/public/videos/${fileName}`;
                }

                if (musicInput.files.length > 0) {
                    const musicFile = musicInput.files[0];
                    const musicFileName = `music_${currentUser.id}_${Date.now()}_${cleanFileName(musicFile.name)}`;
                    await supabaseClient.storage.from('videos').upload(musicFileName, musicFile);
                    musicUrl = `${SUPABASE_URL}/storage/v1/object/public/videos/${musicFileName}`;
                }

                const { data, error } = await supabaseClient.from('users')
                    .update({ 
                        avatar: avatarUrl,
                        bio: bio, 
                        bg_music: musicUrl, 
                        profile_color: primaryColor,
                        profile_bg_color: bgColor 
                    })
                    .eq('id', currentUser.id)
                    .select();

                if (error) throw error;

                currentUser = data[0];
                localStorage.setItem('oldtube_user', JSON.stringify(currentUser));

                alert("Profiliniz Güncellendi!");
                updateUserUI();
                renderProfile(currentUser.username);
                closeModal('editProfileModal');
            } catch (err) {
                alert("Profil Kayıt Hatası: " + err.message);
            } finally {
                btn.disabled = false; btn.innerText = "Değişiklikleri Kaydet";
            }
        }

        // PROFİL SİSTEMİ (Başka Kullanıcıların Profillerini Görünür Yapar)
        async function renderProfile(usernameTarget) {
            const username = usernameTarget || (currentUser ? currentUser.username : null);
            if (!username) return;

            const { data } = await supabaseClient.from('users').select('*').ilike('username', username);
            viewedProfileUser = (data && data.length > 0) ? data[0] : null;

            if (!viewedProfileUser) {
                alert("Kullanıcı bulunamadı!");
                switchTab('normal');
                return;
            }

            document.getElementById('profileNameDisplay').innerHTML = viewedProfileUser.username + checkOwnerBadge(viewedProfileUser.username);
            document.getElementById('profileBioDisplay').innerText = viewedProfileUser.bio || "Henüz biyografi eklenmedi.";
            document.getElementById('profileAvatarDisplay').src = viewedProfileUser.avatar || DEFAULT_AVATAR;

            // Renk Özelleştirmelerini Aç/Uygula
            const primaryColor = viewedProfileUser.profile_color || '#ff0055';
            const pageBgColor = viewedProfileUser.profile_bg_color || '#0b2545';
            const cardDarkerBg = adjustColorBrightness(pageBgColor, -30);

            document.documentElement.style.setProperty('--profile-primary-color', primaryColor);
            document.documentElement.style.setProperty('--profile-page-bg', pageBgColor);
            document.documentElement.style.setProperty('--profile-card-darker-bg', cardDarkerBg);

            // Müzik Çalar
            const musicContainer = document.getElementById('profileMusicContainer');
            const audioPlayer = document.getElementById('profileAudioPlayer');

            if (viewedProfileUser.bg_music) {
                musicContainer.style.display = 'flex';
                audioPlayer.src = viewedProfileUser.bg_music;
            } else {
                musicContainer.style.display = 'none';
                audioPlayer.src = '';
            }

            // Profili Düzenle Butonu Sadece Kendi Profilimizde Görünsün
            const isMyOwn = currentUser && currentUser.username.toLowerCase() === viewedProfileUser.username.toLowerCase();
            document.getElementById('editProfileBtn').style.display = isMyOwn ? 'inline-block' : 'none';

            if (isMyOwn) {
                document.getElementById('pPrimaryColorInput').value = primaryColor;
                document.getElementById('pBgColorInput').value = pageBgColor;
                document.getElementById('pBioInput').value = currentUser.bio || '';
            } else {
                renderProfileSubButton(viewedProfileUser.username);
            }

            // KULLANICININ YÜKLEDİĞİ VİDEOLARI LİSTELE
            renderUserVideos(viewedProfileUser.username);
        }

        function renderUserVideos(username) {
            const grid = document.getElementById('profileVideosGrid');
            grid.innerHTML = '';

            const userVids = loadedVideos.filter(v => v.author.toLowerCase() === username.toLowerCase());

            if (userVids.length === 0) {
                grid.innerHTML = '<p style="opacity:0.7; grid-column:1/-1;">Bu kanal henüz hiç video yüklememiş.</p>';
                return;
            }

            userVids.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => { switchTab('normal'); playVideo(v); };
                card.innerHTML = `
                    <img src="${v.thumb || 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=300'}" alt="${v.title}">
                    <div class="video-card-info">
                        <h4>${v.title}</h4>
                        <span style="font-size:11px; opacity:0.8;">Yükleyen: ${v.author}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function addVideo() {
            if (!currentUser) return alert("Video yüklemek için önce giriş yapmalısınız!");

            const title = document.getElementById('vTitle').value.trim();
            const fileInput = document.getElementById('vFileInput');
            const thumbInput = document.getElementById('vThumbInput');
            const desc = document.getElementById('vDesc').value.trim();

            if (!title || fileInput.files.length === 0) return alert("Başlık ve Video seçilmelidir!");

            const submitBtn = document.getElementById('uploadSubmitBtn');
            submitBtn.disabled = true; submitBtn.innerText = "Yükleniyor...";

            try {
                const videoFile = fileInput.files[0];
                const videoFileName = `video_${Date.now()}_${cleanFileName(videoFile.name)}`;

                await supabaseClient.storage.from('videos').upload(videoFileName, videoFile);
                const videoUrl = `${SUPABASE_URL}/storage/v1/object/public/videos/${videoFileName}`;

                let thumbUrl = "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=300";
                if (thumbInput.files.length > 0) {
                    const thumbFile = thumbInput.files[0];
                    const thumbFileName = `thumb_${Date.now()}_${cleanFileName(thumbFile.name)}`;
                    await supabaseClient.storage.from('videos').upload(thumbFileName, thumbFile);
                    thumbUrl = `${SUPABASE_URL}/storage/v1/object/public/videos/${thumbFileName}`;
                }

                await supabaseClient.from('videos').insert([{
                    title, url: videoUrl, thumb: thumbUrl, type: 'normal', description: desc, author: currentUser.username
                }]);

                alert("Tebrikler! Videonuz yüklendi.");
                closeModal('uploadModal');
                fetchCloudData();
            } catch (err) {
                alert("HATA: " + err.message);
            } finally {
                submitBtn.disabled = false; submitBtn.innerText = "Yükle ve Paylaş";
            }
        }

        function playVideo(video) {
            currentPlayingVideo = video;
            const holder = document.getElementById('playerHolder');
            holder.innerHTML = `<video src="${video.url}" controls autoplay></video>`;

            document.getElementById('videoTitle').innerText = video.title;
            document.getElementById('videoAuthor').innerHTML = `Yükleyen: <span class="clickable-user" onclick="switchTab('profile', '${video.author}')">${video.author}</span> ${checkOwnerBadge(video.author)}`;
            document.getElementById('videoDescription').innerText = video.description || '';

            renderSubButton(video.author);

            document.getElementById('normalActionsBar').style.display = 'flex';
            document.getElementById('normalCommentsSection').style.display = 'flex';
            renderInteractionUI();
        }

        function renderInteractionUI() {
            if (!currentPlayingVideo) return;
            const likes = currentPlayingVideo.likes || [];
            const dislikes = currentPlayingVideo.dislikes || [];
            const comments = currentPlayingVideo.comments || [];

            document.getElementById('likeCount').innerText = likes.length;
            document.getElementById('dislikeCount').innerText = dislikes.length;
            document.getElementById('commentsCount').innerText = comments.length;

            renderCommentsList();
        }

        async function toggleLikeCurrentVideo(type) {
            if (!currentUser) return alert("Giriş yapmalısınız!");
            let likes = currentPlayingVideo.likes || [];
            let dislikes = currentPlayingVideo.dislikes || [];
            const user = currentUser.username;

            if (type === 'like') {
                likes = likes.includes(user) ? likes.filter(u => u !== user) : [...likes, user];
                dislikes = dislikes.filter(u => u !== user);
            } else {
                dislikes = dislikes.includes(user) ? dislikes.filter(u => u !== user) : [...dislikes, user];
                likes = likes.filter(u => u !== user);
            }

            currentPlayingVideo.likes = likes;
            currentPlayingVideo.dislikes = dislikes;

            await supabaseClient.from('videos').update({ likes, dislikes }).eq('id', currentPlayingVideo.id);
            renderInteractionUI();
        }

        async function submitComment() {
            if (!currentUser) return alert("Giriş yapmalısınız!");
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;

            let comments = currentPlayingVideo.comments || [];
            comments.push({ author: currentUser.username, avatar: currentUser.avatar || DEFAULT_AVATAR, text });

            currentPlayingVideo.comments = comments;
            await supabaseClient.from('videos').update({ comments }).eq('id', currentPlayingVideo.id);

            input.value = '';
            renderInteractionUI();
        }

        function renderCommentsList() {
            const container = document.getElementById('commentsListContainer');
            container.innerHTML = '';
            (currentPlayingVideo.comments || []).slice().reverse().forEach(c => {
                container.innerHTML += `
                    <div class="comment-item">
                        <img src="${c.avatar || DEFAULT_AVATAR}" class="comment-avatar">
                        <div class="comment-content">
                            <div style="font-size:11px; font-weight:bold;">
                                <span class="clickable-user" onclick="switchTab('profile', '${c.author}')">${c.author}</span> ${checkOwnerBadge(c.author)}
                            </div>
                            <div style="font-size:12px; margin-top:2px;">${c.text}</div>
                        </div>
                    </div>`;
            });
        }

        function renderVideos(videoArray) {
            const listContainer = document.getElementById('videoList');
            listContainer.innerHTML = '';

            if (videoArray.length === 0) {
                listContainer.innerHTML = '<p style="padding:10px; opacity:0.7;">Video bulunamadı.</p>';
                return;
            }

            videoArray.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => playVideo(v);
                card.innerHTML = `
                    <img src="${v.thumb || 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=300'}" alt="${v.title}">
                    <div class="video-card-info">
                        <h4>${v.title}</h4>
                        <span style="font-size:11px; opacity:0.8;">Kanal: ${v.author} ${checkOwnerBadge(v.author)}</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // ABONE OLUNAN KANALLARIN LİSTESİ (Sadece Kanallar)
        function renderSubscriptionsTab() {
            const listContainer = document.getElementById('subsChannelsList');
            listContainer.innerHTML = '';

            if (!currentUser) {
                listContainer.innerHTML = '<p style="padding:20px;">Aboneliklerinizi görmek için giriş yapmalısınız.</p>';
                return;
            }

            const mySubs = currentUser.subscriptions || [];
            if (mySubs.length === 0) {
                listContainer.innerHTML = '<p style="padding:20px;">Henüz hiçbir kanala abone olmadınız.</p>';
                return;
            }

            mySubs.forEach(authorName => {
                const targetUser = loadedUsers.find(u => u.username.toLowerCase() === authorName.toLowerCase());
                const avatar = targetUser ? (targetUser.avatar || DEFAULT_AVATAR) : DEFAULT_AVATAR;

                const card = document.createElement('div');
                card.className = 'channel-card';
                card.onclick = () => switchTab('profile', authorName);
                card.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px;">
                        <img src="${avatar}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
                        <div>
                            <span style="font-weight:bold; font-size:14px;">${authorName}</span>
                            ${checkOwnerBadge(authorName)}
                        </div>
                    </div>
                    <button class="btn" style="font-size:11px;">Kanalı Gör ➔</button>
                `;
                listContainer.appendChild(card);
            });
        }

        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!username || !password) return alert("Tüm alanları doldurun!");

            try {
                const { data: existing } = await supabaseClient.from('users').select('*').ilike('username', username);
                if (existing && existing.length > 0) return alert("Bu kullanıcı adı zaten alınmış!");

                const { data: newUser, error } = await supabaseClient.from('users').insert([{ 
                    username, password, avatar: DEFAULT_AVATAR, subscriptions: []
                }]).select();

                if (error) throw error;

                alert("Kayıt Başarılı! Otomatik giriş yapılıyor.");
                currentUser = newUser[0];
                localStorage.setItem('oldtube_user', JSON.stringify(currentUser));
                updateUserUI();
                closeModal('registerModal');
                fetchCloudData();
            } catch (err) {
                alert("Kayıt Hatası: " + err.message);
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) return alert("Kullanıcı adı ve şifre girin!");

            try {
                const { data, error } = await supabaseClient.from('users')
                    .select('*')
                    .ilike('username', username)
                    .eq('password', password);

                if (error) throw error;

                if (data && data.length > 0) {
                    currentUser = data[0];
                    localStorage.setItem('oldtube_user', JSON.stringify(currentUser));
                    updateUserUI();
                    closeModal('loginModal');
                    alert("Giriş Yapıldı! Hoş geldin " + currentUser.username);
                } else {
                    alert("Kullanıcı adı veya şifre hatalı!");
                }
            } catch (err) {
                alert("Giriş Hatası: " + err.message);
            }
        }

        function logout() {
            currentUser = null; 
            localStorage.removeItem('oldtube_user');
            updateUserUI(); 
            switchTab('normal');
        }

        function updateUserUI() {
            if (currentUser) {
                document.getElementById('authButtons').style.display = 'none';
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('uploadBtn').style.display = 'block';
                document.getElementById('btnProfile').style.display = 'block';
                document.getElementById('usernameDisplay').innerHTML = currentUser.username + checkOwnerBadge(currentUser.username);
                document.getElementById('headerAvatarImg').src = currentUser.avatar || DEFAULT_AVATAR;
            } else {
                document.getElementById('authButtons').style.display = 'flex';
                document.getElementById('userInfo').style.display = 'none';
                document.getElementById('uploadBtn').style.display = 'none';
                document.getElementById('btnProfile').style.display = 'none';
            }
        }

        function switchTab(tab, usernameTarget) {
            document.getElementById('normalView').style.display = tab === 'normal' ? 'flex' : 'none';
            document.getElementById('subscriptionsView').style.display = tab === 'subscriptions' ? 'flex' : 'none';
            document.getElementById('profileView').style.display = tab === 'profile' ? 'flex' : 'none';

            document.getElementById('btnNormal').classList.remove('nav-active');
            document.getElementById('btnSubs').classList.remove('nav-active');
            document.getElementById('btnProfile').classList.remove('nav-active');

            if (tab === 'profile') {
                document.body.classList.add('profile-active-page');
                if (currentUser && usernameTarget && currentUser.username.toLowerCase() === usernameTarget.toLowerCase()) {
                    document.getElementById('btnProfile').classList.add('nav-active');
                }
                renderProfile(usernameTarget);
            } else {
                document.body.classList.remove('profile-active-page');
            }

            if (tab === 'normal') document.getElementById('btnNormal').classList.add('nav-active');
            if (tab === 'subscriptions') {
                document.getElementById('btnSubs').classList.add('nav-active');
                renderSubscriptionsTab();
            }
        }

        function shareCurrentVideo() { navigator.clipboard.writeText(window.location.href); alert("Bağlantı Kopyalandı!"); }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function toggleTheme() { document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); }
    </script>
</body>
</html>
